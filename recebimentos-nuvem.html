<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lobo Industrial — Recebimentos na nuvem</title><style>
body{margin:0;background:#f5f7fa;color:#152b45;font:15px system-ui,Arial}main{max-width:980px;margin:30px auto;padding:24px;background:white;border-radius:12px;box-shadow:0 2px 18px #0001}h1{font-size:24px}label{display:block;margin:12px 0 5px;font-weight:600}input,select,button{padding:10px;font:inherit;border:1px solid #bbc5d0;border-radius:7px}input,select{width:100%;box-sizing:border-box}button{cursor:pointer;background:#173d60;color:white;margin:12px 8px 0 0}button:disabled{opacity:.55}table{width:100%;border-collapse:collapse;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.muted{color:#586b7b}#status{white-space:pre-wrap}section[hidden]{display:none}</style></head><body><main><nav aria-label="Módulos de teste" style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px"><a href="./painel-nuvem.html" style="color:#173d60">Painel</a> · <a href="./compras-nuvem.html">Compras</a> · <a href="./recebimentos-nuvem.html">Recebimentos</a> · <a href="./producao-nuvem.html">Lotes</a> · <a href="./cortes-nuvem.html">Cortes</a> · <a href="./custos-nuvem.html">Custos</a></nav>
<h1>Lobo Industrial — Recebimento de malha</h1><p class="muted">Tela experimental cloud-first. O recebimento deve estar associado a uma compra existente. Não use com dados reais até os testes de integração.</p>
<section id="auth"><form id="login"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><button id="enter">Entrar</button></form></section>
<section id="app" hidden><p id="identity"></p><form id="receipt"><div class="grid"><label>Compra de origem<select id="purchase" required></select></label><label>Data de recebimento<input id="date" type="date" required></label><label>Malha recebida (kg)<input id="malhakg" type="number" min="0.001" step="0.001" required></label><label>Nota fiscal<input id="invoice"></label><label>Observação<input id="notes"></label></div><button id="save">Salvar no banco</button><button id="cancel" type="button">Cancelar edição</button></form><button id="reload">Atualizar do Supabase</button><button id="logout">Sair</button><table><thead><tr><th>Compra</th><th>Data</th><th>Malha (kg)</th><th>NF</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></section><p id="status" role="status"></p></main>
<script type="module">
import { LoboCloudController } from './src/cloud-controller.js';
import { readSession, saveSession, clearSession, verifyAdminSession } from './src/auth-session.js';
const URL='https://yldgebyfflbacicsfseh.supabase.co',KEY='sb_publishable_5GCZ1S_XsQXLfmJbn94WmA_hINR9q38';
const $=id=>document.getElementById(id);let session=null,editing=null,receipts=[],purchases=[];
const controller=new LoboCloudController({url:URL,publishableKey:KEY,getAccessToken:async()=>session?.access_token,getUserId:async()=>session?.user_id});
async function authRequest(path,body){
 const r=await fetch(URL+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.message||'Falha no login');return d;
}
async function reload(){
 $('status').textContent='Consultando o banco...';
 [purchases,receipts]=await Promise.all([controller.list('fabric_purchases'),controller.list('fabric_receipts')]);
 const select=$('purchase'),selected=select.value;
 select.replaceChildren(...purchases.map(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=(p.number||p.id)+' — '+(p.fabricBrand||'Malha');return o}));
 if(purchases.some(p=>p.id===selected))select.value=selected;
 $('rows').replaceChildren(...receipts.map(r=>{
  const tr=document.createElement('tr');const p=purchases.find(p=>p.id===(r.purchaseId||r.purchase_id));
  for(const v of [p?.number||r.purchaseId||'',r.date||'',String(r.materials?.malha?.kg??''),r.invoice||'']){const td=document.createElement('td');td.textContent=v;tr.append(td)}
  const td=document.createElement('td'),btn=document.createElement('button');btn.textContent='Editar';btn.type='button';btn.onclick=()=>{
   editing=r;$('purchase').value=r.purchaseId||r.purchase_id||'';$('date').value=r.date||'';$('malhakg').value=r.materials?.malha?.kg??'';$('invoice').value=r.invoice||'';$('notes').value=r.notes||'';window.scrollTo(0,0)
  };td.append(btn);tr.append(td);return tr;
 }));
 $('status').textContent=receipts.length+' recebimento(s) carregado(s) do Supabase.';
}
$('login').onsubmit=async e=>{
 e.preventDefault();$('enter').disabled=true;$('status').textContent='Validando acesso...';
 try{
  const d=await authRequest('/auth/v1/token?grant_type=password',{email:$('email').value.trim(),password:$('password').value});
  session=saveSession(d);$('password').value='';
  await verifyAdminSession(URL,KEY,session);
  await reload();$('identity').textContent='Conectado: '+d.user.email;$('auth').hidden=true;$('app').hidden=false;
 }catch(err){session=null;clearSession();$('status').textContent=err.message}finally{$('enter').disabled=false}
};
$('receipt').onsubmit=async e=>{
 e.preventDefault();$('save').disabled=true;$('status').textContent='Salvando no banco...';
 try{
  const purchaseId=$('purchase').value,kg=Number($('malhakg').value);
  if(!purchases.some(p=>p.id===purchaseId))throw Error('Selecione uma compra cadastrada.');
  if(!Number.isFinite(kg)||kg<=0)throw Error('Informe a quantidade válida.');
  const duplicate=receipts.find(r=>r.id!==editing?.id&&(r.purchaseId||r.purchase_id)===purchaseId);
  if(duplicate)throw Error('Esta compra já possui recebimento. Edite o existente para evitar duplicação.');
  const data={purchaseId,date:$('date').value,materials:{malha:{kg}},invoice:$('invoice').value.trim(),notes:$('notes').value.trim()};
  const record=editing?{...editing,...data}:{id:crypto.randomUUID(),...data};
  await controller.save('fabric_receipts',record);editing=null;$('receipt').reset();await reload();$('status').textContent='Recebimento confirmado no Supabase.';
 }catch(err){$('status').textContent='Não foi salvo: '+err.message}finally{$('save').disabled=false}
};
$('cancel').onclick=()=>{editing=null;$('receipt').reset()};
$('reload').onclick=()=>reload().catch(e=>$('status').textContent=e.message);
$('logout').onclick=()=>{clearSession();session=null;editing=null;receipts=[];purchases=[];$('app').hidden=true;$('auth').hidden=false;$('status').textContent='Sessão local encerrada.'};

async function restoreSession(){
 const previous=readSession();if(!previous)return;
 session=previous;$('status').textContent='Restaurando acesso...';
 try{
  await verifyAdminSession(URL,KEY,session);
  await reload();
  $('identity').textContent='Conectado: '+(session.email||'Administrador');
  $('auth').hidden=true;$('app').hidden=false;
 }catch(err){
  clearSession();session=null;$('auth').hidden=false;$('app').hidden=true;
  $('status').textContent='Entre novamente: '+err.message;
 }
}
restoreSession();
</script></body></html>
